<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Call Lambda Service</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
</head>

<body>
  <form id="lambdaForm">
    <label for="bpmnData">Upload BPMN file:</label>
    <input type="file" id="bpmnData" name="bpmnData" required><br><br>

    <label for="cwpData">Upload CWP file:</label>
    <input type="file" id="cwpData" name="cwpData" required><br><br>

    <div id="mmdContainer" style="display:none; margin-bottom:20px;">
      <label for="mmdText">Mermaid Source (editable):</label><br>
      <textarea id="mmdText" rows="10" cols="80"></textarea>
      <div id="mermaidPreview" class="mermaid" style="margin-top:10px; border:1px solid #ccc; padding:10px;"></div>
    </div>

    <label for="stateData">Upload state file:</label>
    <input type="file" id="stateData" name="stateData" required><br><br>

    <button type="submit">Submit</button>
  </form>

  <div id="statusContainer" style="margin-top: 20px; font-size: 16px; color: blue;"></div>
  <pre><code id="spinReport" hidden></code></pre>
  <a id="promelaLink" href="promela.html" target="_blank" hidden>Promela</a>

  <script>
    mermaid.initialize({ startOnLoad: false });

    async function renderMermaid() {
      const text = document.getElementById('mmdText').value;
      const preview = document.getElementById('mermaidPreview');
      try {
        const { svg } = await mermaid.render('mermaidGraph', text);
        preview.innerHTML = svg;
      } catch (err) {
        preview.innerHTML = `<span style="color:red;">Mermaid render error: ${err.message}</span>`;
      }
    }

    document.getElementById('cwpData').addEventListener('change', async function () {
      const file = this.files[0];
      const mmdContainer = document.getElementById('mmdContainer');
      const mmdText = document.getElementById('mmdText');

      if (file && file.name.toLowerCase().endsWith('.mmd')) {
        const text = await file.text();
        mmdText.value = text;
        mmdContainer.style.display = 'block';
        renderMermaid();
      } else {
        mmdContainer.style.display = 'none';
        mmdText.value = '';
      }
    });

    document.getElementById('mmdText').addEventListener('input', renderMermaid);

    function populateSpinReport(report) {
      const container = document.getElementById('spinReport');
      container.innerText = report;
      container.hidden = false;
      const promelaLink = document.getElementById("promelaLink");
      promelaLink.hidden = false;
    }

    let spinReport = localStorage.getItem('spinReport');
    if (spinReport) populateSpinReport(spinReport);

    document.getElementById('lambdaForm').addEventListener('submit', async function (event) {
      event.preventDefault();

      const bpmnData = document.getElementById('bpmnData').files[0];
      const cwpData = document.getElementById('cwpData').files[0];
      const stateData = document.getElementById('stateData').files[0];
      const statusContainer = document.getElementById('statusContainer');
      const lambdaUrl = 'https://iatjgvm4gt75bw4qwbz7l3bihq0irdns.lambda-url.us-east-1.on.aws/';

      statusContainer.textContent = 'Processing...';
      populateSpinReport('');

      const fileToString = (file) => {
        return new Promise((resolve, reject) => {
          if (!file) resolve(null);
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = (error) => reject(error);
          reader.readAsText(file);
        });
      };

      try {
        const isMmd = cwpData && cwpData.name.toLowerCase().endsWith('.mmd');
        const cwpContent = isMmd
          ? document.getElementById('mmdText').value
          : await fileToString(cwpData);

        const payload = {
          state: await fileToString(stateData),
          cwp: cwpContent,
          bpmn: await fileToString(bpmnData),
        };

        const response = await fetch(lambdaUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        if (!response.ok) {
          const body = await response.json();
          throw new Error(`HTTP error! Status: ${response.status}—${body.error}`);
        }

        const result = await response.json();

        let report = result.spin_report;
        let promela = result.promela;

        populateSpinReport(report);

        localStorage.setItem('spinReport', report);
        localStorage.setItem('promela', promela);

        statusContainer.innerHTML = 'Spin Report:';

        const promelaLink = document.getElementById("promelaLink");
        promelaLink.hidden = false;
      } catch (error) {
        console.error('Error calling Lambda:', error);
        statusContainer.textContent = `Error: ${error.message}`;
      }
    });
  </script>
</body>

</html>
